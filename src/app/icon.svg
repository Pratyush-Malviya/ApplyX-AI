<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="applyx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gold Sparkle Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="120" fill="url(#applyx-bg)" />

  <!-- Subtle Border Rim -->
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" />

  <!-- Core Logo Mark: Bold stylized 'A' & 'X' emblem -->
  <!-- Left stem of A/X -->
  <path d="M 145 375 L 256 145 L 367 375" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Horizontal & Diagonal 'X' Crossbar with accent curve -->
  <path d="M 185 290 L 327 290" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" />
  <path d="M 215 220 L 335 365" fill="none" stroke="#38BDF8" stroke-width="36" stroke-linecap="round" />

  <!-- AI Sparkle 4-point star on top right -->
  <path d="M 375 95 C 375 125 395 145 425 145 C 395 145 375 165 375 195 C 375 165 355 145 325 145 C 355 145 375 125 375 95 Z" fill="url(#gold-grad)" filter="url(#glow)" />

  <!-- Mini secondary blue sparkle on bottom left -->
  <path d="M 140 120 C 140 135 148 143 163 143 C 148 143 140 151 140 166 C 140 151 132 143 117 143 C 132 143 140 135 140 120 Z" fill="#60A5FA" opacity="0.85" />
</svg>
